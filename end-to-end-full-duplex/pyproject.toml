[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxbase-omni"
version = "0.1.0"
description = "Qwen2.5-Omni action-token adaptation and legacy Qwen3 audio-input experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.6",
    "transformers==4.57.6",
]

[project.optional-dependencies]
continuous = ["qwen-asr==0.0.6"]

[tool.setuptools.packages.find]
where = ["src"]
