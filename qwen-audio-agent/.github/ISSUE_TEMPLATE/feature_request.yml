name: Feature request
description: 提议一项具体改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 请先描述需要解决的问题，而不只是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 涉及网络访问、权限、隐私或数据持久化
        - label: 涉及 OpenCode/OpenClaw 兼容性
        - label: 涉及 WebUI、TUI 或桌面端行为
